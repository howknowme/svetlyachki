# Builds the game for Android in the cloud on every push to main (or from Actions > Run workflow).
# Always: a test .apk you can install on your phone.
# With four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# it also builds the signed .aab for Google Play.
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Build the game page and copy it into the Android project
        run: |
          python3 scripts/build-www.py
          python3 scripts/set-admob-app-id.py
          npx cap sync android

      - name: Build a test .apk (installs on any phone, no key needed)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/svetlyachki-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: svetlyachki-test-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/svetlyachki-test.apk

      - name: Check for the upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret yet: skipping the signed Google Play build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the signed .aab for Google Play
        if: steps.key.outputs.present == 'true'
        working-directory: android
        env:
          SVET_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SVET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SVET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SVET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: svetlyachki-google-play-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
