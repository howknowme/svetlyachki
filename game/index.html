<meta charset="utf-8">
<title>Светлячки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#13152b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@500;600;800&display=swap">
<style>
/* Layout: a paper-cut night. Ink-blue ground with grain, a postcard picture on top, the board as a dark printed panel,
   cream paper for every card and button. One accent: firefly lime. Single deliberate dark world, no light theme. */
:root {
  --ink: #13152b;        /* page ground */
  --ink-2: #1c1f3d;      /* panels */
  --ink-3: #262a52;      /* empty slots, outlines */
  --paper: #efe6d2;      /* text on dark, card ground */
  --paper-2: #d9ceb6;    /* paper shade */
  --dim: #8d8fb5;        /* secondary text on dark */
  --lime: #d7ef5f;       /* fireflies, the single accent */
  --ember: #f08a4b;      /* bombs and streaks */
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background-color: var(--ink);
  background-image: var(--grain, none);
  color: var(--paper);
  font-family: var(--body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: flex; flex-direction: column; gap: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px;
  box-sizing: border-box;
}
header, .bar { width: 100%; max-width: 520px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.logo svg { flex: none; }
.logo-text { min-width: 0; }
.logo h1 {
  font-family: var(--display); font-weight: 900; font-size: 1.05rem; margin: 0; line-height: 1;
  letter-spacing: 0.02em; text-transform: uppercase; color: var(--paper);
}
.logo span { display: block; margin-top: 4px; font-size: 0.78rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat { text-align: right; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 0.95rem; }
.stat b.lit { color: var(--lime); }
.stat small { color: var(--dim); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; }
.stage { flex: 1; position: relative; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.bar { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 40px; gap: 6px; }
.chip {
  font: 800 0.82rem var(--body); color: var(--ink); cursor: pointer;
  background: var(--paper); border: 0; border-radius: 10px;
  box-shadow: 0 3px 0 var(--paper-2), 0 3px 0 2px rgba(0,0,0,0.35);
  padding: 9px 6px; min-height: 40px; min-width: 0; white-space: nowrap;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: transform 0.08s;
}
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--paper-2); }
.chip svg { flex: none; }
.chip .n { font-family: var(--display); font-size: 0.72rem; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 2px 6px; font-variant-numeric: tabular-nums; }
.chip.sq { width: 40px; padding: 0; }
.chip.off { opacity: 0.45; }
.chip:disabled { opacity: 0.35; cursor: default; }
.chip.armed { background: var(--ember); box-shadow: 0 3px 0 #b85a26; }
.chip:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

/* postcards (all dialogs) */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(10, 11, 26, 0.72);
  display: grid; place-items: center;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: 100%; max-width: 380px; max-height: 86vh; overflow: auto; box-sizing: border-box;
  background: var(--paper); background-image: var(--grain, none); color: var(--ink);
  border-radius: 6px; padding: 22px 20px 20px; text-align: left;
  box-shadow: 0 0 0 6px var(--paper), 0 0 0 7px #b9ad93, 0 24px 60px rgba(0,0,0,0.55);
  transform: rotate(-0.6deg);
}
.card .eyebrow { font: 800 0.68rem var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: #8a7f68; margin: 0 0 6px; }
.card h2 { font-family: var(--display); font-weight: 900; font-size: 1.3rem; line-height: 1.15; margin: 0 0 12px; text-wrap: balance; }
.card p { margin: 0 0 14px; line-height: 1.5; font-size: 0.97rem; color: #3a3a52; }
.card canvas.pc { width: 100%; height: auto; display: block; margin: 2px 0 14px; border: 5px solid #fff8e8; box-shadow: 0 2px 0 #b9ad93; transform: rotate(0.8deg); }
.btn {
  font: 800 1rem var(--body); color: var(--paper); cursor: pointer; width: 100%;
  background: var(--ink); border: 0; border-radius: 10px; padding: 13px 18px;
  box-shadow: 0 3px 0 #000; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn + .btn { margin-top: 10px; }
.btn.alt { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
.btn:disabled { opacity: 0.4; }
.how { display: grid; gap: 10px; margin: 0 0 18px; padding: 0; list-style: none; counter-reset: how; }
.how li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; line-height: 1.4; color: #3a3a52; }
.how li::before { counter-increment: how; content: counter(how); font: 900 0.8rem var(--display); background: var(--ink); color: var(--lime); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; }
.stars { display: flex; gap: 6px; margin: 0 0 10px; }
.stars svg { width: 34px; height: 34px; }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.gallery figure { margin: 0; min-width: 0; }
.gallery canvas { width: 100%; height: auto; display: block; border: 3px solid #fff8e8; box-shadow: 0 2px 0 #b9ad93; }
.gallery figcaption { font-size: 0.74rem; color: #5a5670; margin-top: 4px; }
.gallery figcaption b { color: #b8860b; letter-spacing: 0.05em; }
.empty { color: #6a6680; font-size: 0.92rem; }
.field { display: grid; gap: 6px; margin: 0 0 14px; }
.field label { font: 800 0.75rem var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: #6a6680; }
.field input {
  font: 700 1.1rem var(--body); color: var(--ink); background: #fff8e8; border: 2px solid var(--ink); border-radius: 10px;
  padding: 10px 12px; width: 100%; box-sizing: border-box; -webkit-user-select: text; user-select: text;
}
.field input:focus { outline: 3px solid var(--lime); outline-offset: 1px; }
.err { color: #b3361e; font-size: 0.85rem; min-height: 1.2em; margin: -6px 0 10px; }
.board-list { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.board-list li { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px dashed #c9bda2; }
.board-list li .rk { font: 900 0.85rem var(--display); color: #8a7f68; text-align: center; }
.board-list li:nth-child(1) .rk { color: #b8860b; }
.board-list li .nk { font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-list li .nt { font-size: 0.75rem; color: #6a6680; }
.board-list li .sc { font: 700 0.9rem var(--display); }
.board-list li.me { background: #e4f3a0; border-radius: 8px; border-bottom-color: transparent; }
.note { font-size: 0.8rem; color: #6a6680; margin: 0 0 14px; }
.pick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 16px; }
.pick { border: 2px solid transparent; border-radius: 10px; background: #fff8e8; padding: 6px 6px 8px; cursor: pointer; font: 700 0.72rem var(--body); color: #13152b; display: grid; gap: 5px; justify-items: center; text-align: center; min-width: 0; }
.pick canvas, .pick .sw { width: 100%; height: 44px; border-radius: 6px; display: block; }
.pick[aria-pressed="true"] { border-color: #13152b; box-shadow: 0 3px 0 #13152b; }
.pick:disabled { cursor: default; opacity: 0.55; }
.pick small { font-weight: 600; color: #6a6680; font-size: 0.66rem; }
.card h3 { font: 800 0.75rem var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: #8a7f68; margin: 4px 0 8px; }
.overlay.low { align-items: end; background: rgba(10, 11, 26, 0.35); }
.menu { display: grid; gap: 10px; }
.daily-btn { text-align: left; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; background: var(--ink); color: var(--paper); border: 0; border-radius: 10px; padding: 14px 16px; cursor: pointer; box-shadow: 0 3px 0 #000; font: inherit; }
.daily-btn b { font: 900 1rem var(--display); color: var(--lime); }
.daily-btn small { grid-column: 1; color: var(--dim); font-size: 0.8rem; }
.daily-btn span.go { grid-row: 1 / span 2; grid-column: 2; font: 900 1.4rem var(--display); color: var(--lime); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 12px; }
.tab { font: 800 0.85rem var(--body); padding: 8px; border-radius: 8px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--lime); }
.card .big-score { font: 900 2.6rem var(--display); margin: 0 0 4px; font-variant-numeric: tabular-nums; }
.rank-badge { display: inline-block; background: var(--ink); color: var(--lime); font: 800 0.78rem var(--body); letter-spacing: 0.06em; padding: 5px 10px; border-radius: 99px; margin: 0 0 12px; }
@media (max-width: 380px) { .chip:not(.sq) svg { display: none; } .chip { font-size: 0.78rem; gap: 4px; } }
@media (prefers-reduced-motion: reduce) { .card { transform: none; } .chip { transition: none; } }
</style>

<div class="app">
  <header>
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="21" r="12" fill="#d7ef5f" opacity="0.18"/>
        <circle cx="17" cy="21" r="7" fill="#d7ef5f" opacity="0.35"/>
        <ellipse cx="17" cy="21" rx="4" ry="5" fill="#d7ef5f"/>
        <ellipse cx="17" cy="13" rx="3.6" ry="4.4" fill="#efe6d2"/>
        <path d="M13.6 12.5 C8 6, 4 9, 7 13.5 C9 16, 12 15, 14 14Z M20.4 12.5 C26 6, 30 9, 27 13.5 C25 16, 22 15, 20 14Z" fill="#efe6d2" opacity="0.75"/>
        <path d="M15.5 9 L13 4.5 M18.5 9 L21 4.5" stroke="#efe6d2" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div class="logo-text">
        <h1>Светлячки</h1>

      Бомба <span class="n" id="bombN">1</span>
    </button>
    <button class="chip" id="shuffleBtn" title="Дать другие фигурки">

      Сменить <span class="n" id="shuffleN">1</span>

      Отмена <span class="n" id="undoN">1</span>

    <button class="chip sq" id="menuBtn" aria-label="Меню" title="Меню: Ночь дня, лидеры, открытки, звук">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="currentColor"><rect x="3" y="4" width="14" height="2.4" rx="1.2"/><rect x="3" y="8.8" width="14" height="2.4" rx="1.2"/><rect x="3" y="13.6" width="14" height="2.4" rx="1.2"/></svg>
    </button>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
'use strict';
const N = 8;
const STORE = 'svetlyachki-v1';
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

/* ---------- pieces ---------- */
const SHAPE_SRC = ['X','XX','X/X','XXX','X/X/X','XXXX','X/X/X/X','XXXXX','X/X/X/X/X','XX/XX','XXX/XXX/XXX',
  'X./XX','.X/XX','XX/X.','XX/.X','X../X../XXX','..X/..X/XXX','XXX/X../X..','XXX/..X/..X',
  'XXX/.X.','.X./XXX','X./XX/X.','.X/XX/.X','XX./.XX','.XX/XX.','X./XX/.X','.X/XX/X.','XX/XX/XX','XXX/XXX'];
const SHAPES = SHAPE_SRC.map(s => {
  const rows = s.split('/'); const cells = [];
  rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === 'X') cells.push([r, c]); }));
  return { cells, h: rows.length, w: rows[0].length };
});
// every piece can be turned: find (or add) the clockwise rotation of each shape
const shapeKey = cells => cells.map(([r, c]) => r + ':' + c).sort().join(',');
const ROT = [];
for (let i = 0; i < SHAPES.length; i++) {
  const sh = SHAPES[i];
  const cells = sh.cells.map(([r, c]) => [c, sh.h - 1 - r]);
  const key = shapeKey(cells);
  let j = SHAPES.findIndex(x => shapeKey(x.cells) === key);
  if (j < 0) { SHAPES.push({ cells, h: sh.w, w: sh.h }); j = SHAPES.length - 1; }
  ROT[i] = j;
}
const BASE_SHAPES = SHAPE_SRC.length;
/* Block skins: each has six colours [face, edge] and its own way of drawing a tile.
   Unlocked by the total number of stars. */
const SKINS = [
  { id: 'paper', name: 'Бумага', stars: 0, style: 'paper', colors: [['#e3b448', '#a87c22'], ['#7fae6b', '#4f7a3f'], ['#6f8fd0', '#465f9a'], ['#d9785a', '#9c4b33'], ['#a873b8', '#734a82'], ['#4fb0a5', '#2f7a72']] },
  { id: 'candy', name: 'Леденцы', stars: 5, style: 'candy', colors: [['#ff5d8f', '#c22a5c'], ['#ffd23f', '#d19a00'], ['#3bceac', '#16927a'], ['#4d9de0', '#2366a8'], ['#b36bff', '#7a35cc'], ['#ff8c42', '#cc5a12']] },
  { id: 'wood', name: 'Дерево', stars: 10, style: 'wood', colors: [['#c8935a', '#8a5a2b'], ['#a8744a', '#6e4423'], ['#d9b07a', '#9c7442'], ['#8f5f3a', '#5a3519'], ['#b98a5e', '#7a5330'], ['#e0bf8f', '#a8875a']] },
  { id: 'lantern', name: 'Фонарики', stars: 16, style: 'lantern', colors: [['#ffd36b', '#3a2a10'], ['#b6ff6b', '#1f3510'], ['#6bd8ff', '#10283a'], ['#ff8a6b', '#3a1810'], ['#e08aff', '#2c1038'], ['#6bffd2', '#103a30']] },
  { id: 'gem', name: 'Самоцветы', stars: 24, style: 'gem', colors: [['#ff4d6d', '#9d0b2c'], ['#4dd8ff', '#0b6d9d'], ['#7dff4d', '#2c9d0b'], ['#ffd24d', '#9d760b'], ['#b84dff', '#5c0b9d'], ['#ff8f4d', '#9d3c0b']] },
  { id: 'pixel', name: 'Пиксели', stars: 32, style: 'pixel', colors: [['#f7d51d', '#b08f00'], ['#e03c28', '#8f1a0d'], ['#3cb371', '#1d6b3f'], ['#2b7de9', '#14479a'], ['#9b5de5', '#5a2b9c'], ['#f15bb5', '#a1236f']] }
];
/* Themes recolour the whole game. Unlocked by nights finished. */
const THEMES = [
  { id: 'paper', name: 'Бумажная ночь', nights: 0, ink: '#13152b', ink2: '#1c1f3d', ink3: '#262a52', paper: '#efe6d2', paper2: '#d9ceb6', dim: '#8d8fb5', accent: '#d7ef5f', ember: '#f08a4b' },
  { id: 'winter', name: 'Зимняя ночь', nights: 2, ink: '#0d1a2b', ink2: '#16293f', ink3: '#22395a', paper: '#eaf3f8', paper2: '#c6d8e3', dim: '#8aa6c2', accent: '#9fe8ff', ember: '#ff8fa3' },
  { id: 'autumn', name: 'Осенний лес', nights: 4, ink: '#1c130f', ink2: '#2a1d16', ink3: '#3d2a1f', paper: '#f3e3cc', paper2: '#dcc6a6', dim: '#b0957c', accent: '#ffb347', ember: '#e8573a' },
  { id: 'sakura', name: 'Сакура', nights: 7, ink: '#1c1124', ink2: '#2a1a36', ink3: '#3d2650', paper: '#f8e9ef', paper2: '#e3c9d4', dim: '#b495b8', accent: '#ffb7d5', ember: '#ff7aa0' },
  { id: 'neon', name: 'Неоновый город', nights: 10, ink: '#07070d', ink2: '#12121f', ink3: '#1f1f36', paper: '#e9e9ff', paper2: '#c4c4e6', dim: '#8484b8', accent: '#39ffb0', ember: '#ff3df2' },
  { id: 'dawn', name: 'Рассвет', nights: 15, ink: '#2a1f3d', ink2: '#3a2b52', ink3: '#4e3b6b', paper: '#fff1e0', paper2: '#ecd5bb', dim: '#b9a3c9', accent: '#ffd166', ember: '#ff6b6b' }
];
let SKIN = SKINS[0], THEME = THEMES[0], COLORS = SKIN.colors;
const totalStars = () => Object.values(S.stars || {}).reduce((a, b) => a + b, 0);
function applyLook() {
  SKIN = SKINS.find(k => k.id === S.skin && totalStars() >= k.stars) || SKINS[0];
  THEME = THEMES.find(t => t.id === S.theme && (S.cards || []).length >= t.nights) || THEMES[0];
  COLORS = SKIN.colors;
  const st = document.documentElement.style;
  [['--ink', 'ink'], ['--ink-2', 'ink2'], ['--ink-3', 'ink3'], ['--paper', 'paper'], ['--paper-2', 'paper2'], ['--dim', 'dim'], ['--lime', 'accent'], ['--ember', 'ember']].forEach(([v, k]) => st.setProperty(v, THEME[k]));
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = THEME.ink;
}
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ---------- levels ---------- */
const TYPES = [
  ['forest', 'Лесная поляна'], ['lake', 'Тихое озеро'], ['village', 'Деревня у холма'],
  ['mountains', 'Горный перевал'], ['city', 'Ночной город'], ['garden', 'Сад с фонариками']
];
const needFor = L => Math.min(5 + L, 14);
function levelInfo(L) {
  const [type, name] = TYPES[L % TYPES.length];
  const round = Math.floor(L / TYPES.length);
  const roman = ['', ' II', ' III', ' IV', ' V', ' VI', ' VII', ' VIII'][round] ?? ' ' + (round + 1);
  return { type, name: name + roman, seed: L * 7919 + 13, need: needFor(L), hue: (round * 37) % 360 };
}
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hashStr(t) { let h = 2166136261; for (const ch of t) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function dailyInfo() {
  const k = todayKey(), h = hashStr(k);
  const [type] = TYPES[h % TYPES.length];
  return { type, name: 'Ночь дня', seed: h % 100000 + 7, need: 12, hue: h % 360, endless: true, daily: k };
}
function curInfo() { return S.mode === 'daily' ? dailyInfo() : levelInfo(S.level); }
const RANKS = [[0, 'Новичок'], [3, 'Ловец светлячков'], [6, 'Фонарщик'], [12, 'Хранитель ночи'], [24, 'Звездочёт'], [48, 'Повелитель звёзд']];
const rankFor = n => RANKS.filter(([k]) => n >= k).pop()[1];
function rngFrom(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

/* ---------- state ---------- */
let S = load() || freshState();
function freshState() {

function rotatePiece(i) {
  const p = S.tray[i]; if (!p) return;
  if (S.mode === 'daily') { say('В «Ночи дня» фигурки не крутятся'); return; }
  if (S.rotates < 1) { if (!offerAdBonus('rotates')) say('Повороты кончились до следующей ночи'); return; }
  if (ROT[p.s] === p.s) { say('Эту фигурку крутить незачем'); return; }
  p.s = ROT[p.s]; S.rotates--; undoSnap = null;
  tone(660, 0, 0.08, 0.06, 'triangle'); buzz(8);
  save(); updateHud();
  if (!S.tray.some(q => q && anyFits(q))) setTimeout(showStuck, 450);
}
let undoSnap = null;
const SNAP_KEYS = ['board', 'tray', 'score', 'moves', 'streak', 'lines', 'bombs', 'lit', 'best'];
function place(i, r0, c0) {
  const piece = S.tray[i], sh = SHAPES[piece.s];
  undoSnap = S.mode === 'daily' ? null : JSON.stringify(SNAP_KEYS.map(k => S[k]));
  sh.cells.forEach(([r, c]) => { S.board[r0 + r][c0 + c] = piece.c; });
  S.tray[i] = null;
  S.score += sh.cells.length;
  S.moves++;
  sfxPlace(); buzz(12);
  // full lines
  const rows = [], cols = [];
  for (let r = 0; r < N; r++) if (S.board[r].every(v => v !== -1)) rows.push(r);
  for (let c = 0; c < N; c++) if (S.board.every(row => row[c] !== -1)) cols.push(c);
  const lines = [...rows.map(r => Array.from({ length: N }, (_, c) => [r, c])), ...cols.map(c => Array.from({ length: N }, (_, r) => [r, c]))];
  if (lines.length) {
    const info = curInfo();
    lines.forEach(cells => {
      cells.forEach(([r, c]) => {
        if (S.board[r][c] === -1) return;
        flashes.push({ r, c, col: S.board[r][c], t: 0 });
        burst(G.x + (c + 0.5) * G.cell, G.boardY + (r + 0.5) * G.cell, 5, COLORS[S.board[r][c]][0]);
      });
      if (S.lit < info.need) { spawnFireflies(cells, S.lit); S.lit++; }
    });
    lines.flat().forEach(([r, c]) => { S.board[r][c] = -1; });
    S.streak++;
    const mult = Math.min(S.streak, 5);
    let gain = 10 * lines.length * lines.length * mult;
    const before = Math.floor(S.lines / 4);
    S.lines += lines.length;
    if (Math.floor(S.lines / 4) > before) { S.bombs++; floats.push({ text: '+1 бомба', x: G.x + G.bw / 2, y: G.boardY + G.bw * 0.72, t: 0, small: true }); }
    const power = lines.length + mult - 1;
    const words = ['Хорошо!', 'Отлично!', 'Супер!', 'Невероятно!', 'Легенда!'];
    if (power >= 2) floats.push({ text: words[Math.min(power - 2, words.length - 1)], x: G.x + G.bw / 2, y: G.boardY + G.bw * 0.38, t: 0, big: true });
    if (S.board.every(row => row.every(v => v === -1))) {
      gain += 100; S.bombs++;
      floats.push({ text: 'Чистое поле! +100', x: G.x + G.bw / 2, y: G.boardY + G.bw * 0.62, t: 0, big: true });
      shake = Math.max(shake, 14);
    }
    S.score += gain;
    floats.push({ text: (mult > 1 ? `Серия ×${mult}  ` : '') + `+${gain}`, x: G.x + G.bw / 2, y: G.boardY + G.bw / 2, t: 0 });
    shake = Math.max(shake, 3 + power * 3);
    sfxClear(lines.length + mult - 1); buzz(lines.length > 1 ? [30, 40, 60] : 35);
    undoSnap = null; // the fireflies have flown, a cleared line can't be taken back
  } else {
    S.streak = 0;
  }
  if (S.mode !== 'daily') { S.best = Math.max(S.best, S.score); pushScore(); }
  if (S.tray.every(p => !p)) newTray();
  save(); updateHud();
  if (!curInfo().endless && S.lit >= curInfo().need) { levelDone = true; return; }
  if (!S.tray.some(p => p && anyFits(p))) setTimeout(showStuck, 450);
}
function undo() {

function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* gentle night music: a slow pentatonic tune made on the fly */
let musicOn = false, musicTimer = null;
const SCALE = [392, 440, 523, 587, 659, 784, 880];
function startMusic() {
  if (!S.sound || musicOn || !audio()) return;
  musicOn = true; let step = 0;
  const tick = () => {
    if (!S.sound) { musicOn = false; return; }
    const bar = Math.floor(step / 8) % 4, root = [0, 3, 1, 4][bar];
    if (step % 8 === 0) tone(SCALE[root] / 4, 0, 2.2, 0.05, 'sine');
    if (Math.random() < 0.7) tone(SCALE[(root + [0, 2, 4, 2, 5, 4, 2, 1][step % 8]) % SCALE.length], 0, 0.9, 0.025, 'triangle');

/* ---------- ads ----------
   The web page never shows ads. Inside the Android app (Capacitor + AdMob) there are two kinds:
   a rewarded video the player chooses to watch for a bonus, and a short ad between nights
   (never in the first nights, never mid-game, at most every second night). */
const IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const AD_IDS = window.SVET_ADS || {};
const Ads = {
  ready: false, busy: false,
  async init() {
    try {
      const AdMob = IS_APP && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob;
      if (!AdMob || !AD_IDS.rewarded) return;
      await AdMob.initialize({ initializeForTesting: !!AD_IDS.testing, tagForChildDirectedTreatment: false, tagForUnderAgeOfConsent: false, maxAdContentRating: 'General' });
      try {
        const info = await AdMob.requestConsentInfo();
        if (info && info.isConsentFormAvailable && info.status === 'REQUIRED') await AdMob.showConsentForm();
      } catch (e) {}
      this.AdMob = AdMob; this.ready = true; updateHud();
    } catch (e) { this.ready = false; }
  },
  async rewarded() {
    if (!this.ready || this.busy) return false;
    this.busy = true;
    try {
      await this.AdMob.prepareRewardVideoAd({ adId: AD_IDS.rewarded, isTesting: !!AD_IDS.testing });
      const reward = await this.AdMob.showRewardVideoAd();
      return !!reward;
    } catch (e) { return false; } finally { this.busy = false; }
  },
  async between() {
    if (!this.ready || this.busy || !AD_IDS.interstitial) return;
    this.busy = true;
    try { await this.AdMob.prepareInterstitial({ adId: AD_IDS.interstitial, isTesting: !!AD_IDS.testing }); await this.AdMob.showInterstitial(); }
    catch (e) {} finally { this.busy = false; }
  }
};
Ads.init();
function offerAdBonus(kind) {
  if (!Ads.ready) return false;
  const names = { bombs: 'бомбу', undos: 'отмену', shuffles: 'смену фигурок', rotates: '2 поворота' };
  openCard(`<p class="eyebrow">Бонус</p>
    <h2>Бонусы кончились</h2>
    <p>Посмотри короткое видео и получи ${names[kind]}. Это по желанию.</p>
    <button class="btn" id="adYes">Смотреть видео</button>
    <button class="btn alt" id="adNo">Не надо</button>`, card => {
    card.querySelector('#adNo').onclick = closeCard;
    card.querySelector('#adYes').onclick = async () => {
      closeCard();
      if (await Ads.rewarded()) { S[kind] += kind === 'rotates' ? 2 : 1; save(); updateHud(); say('Бонус получен!'); }
    };
  });
  return true;
}

const PLAY_KEYS = ['board', 'tray', 'lit', 'score', 'moves', 'streak', 'seq'];

  const k = todayKey(), g = S.dailyGame;

  if (!fresh && g && g.date === k && !g.over) Object.assign(S, g);
  else Object.assign(S, { board: emptyBoard(), tray: [null, null, null], lit: 0, score: 0, moves: 0, streak: 0, seq: 0 }), newTray();
  S.dailyGame = Object.assign(pick(PLAY_KEYS), { date: k, over: false });

  if (!S.tray.some(p => p && anyFits(p))) setTimeout(showStuck, 600);
}

  Object.assign(S, S.nightStash || { board: emptyBoard(), tray: [null, null, null], lit: 0, score: 0, moves: 0, streak: 0 });

    const a = 0.25 + 0.25 * Math.sin(time * 4);
    drawPiece(S.tray[hint.i], bx + hint.c * c, by + hint.r * c, c, a);
    const tr = trayRect(hint.i);
    ctx.strokeStyle = rgba(THEME.accent, a + 0.2); ctx.lineWidth = 2; rr(tr.x + 6, tr.y + 2, tr.w - 12, tr.h - 4, 14); ctx.stroke();
  }
  // flashes
  flashes = flashes.filter(f => (f.t += dt) < 0.5);
  flashes.forEach(f => {
    const k = 1 - f.t / 0.5, s = c * (1 + (1 - k) * 0.3), x = bx + f.c * c + (c - s) / 2, y = by + f.r * c + (c - s) / 2;
    block(x, y, s, f.col, k);
    ctx.fillStyle = rgba(THEME.paper, k * 0.7); rr(x + s * 0.1, y + s * 0.1, s * 0.8, s * 0.8, s * 0.2); ctx.fill();
  });

  // tray
  for (let i = 0; i < 3; i++) {
    const p = S.tray[i]; if (!p || (drag && drag.i === i)) continue;
    const r = trayRect(i), sc = trayScale(p), shp = SHAPES[p.s], s = c * sc;
    const fits = anyFits(p);
    drawPiece(p, r.x + (r.w - shp.w * s) / 2, r.y + (r.h - shp.h * s) / 2, s, fits ? 1 : 0.35);
  }
  if (S.mode !== 'daily' && !drag) {
    ctx.font = `600 ${Math.max(10, Math.round(c * 0.24))}px 'Golos Text', system-ui, sans-serif`; ctx.textAlign = 'center';
    ctx.fillStyle = rgba(THEME.dim, 0.85);
    ctx.fillText(S.rotates > 0 ? `Нажми на фигурку, чтобы повернуть · осталось ${S.rotates}` : 'Повороты кончились до следующей ночи', bx + G.bw / 2, G.trayY + G.trayH - 8);
  }
  if (drag) { const o = dragOrigin(drag); drawPiece(S.tray[drag.i], o.x, o.y, c, preview ? 0.95 : 0.8); }

  // fireflies in flight
  ctx.globalCompositeOperation = 'lighter';
  particles = particles.filter(p => {
    p.t += dt;
    if (p.t < 0) return true;
    const k = Math.min(1, p.t / p.dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const x = (1 - e) * (1 - e) * p.sx + 2 * (1 - e) * e * p.cx + e * e * p.tx;
    const y = (1 - e) * (1 - e) * p.sy + 2 * (1 - e) * e * p.cy + e * e * p.ty;
    glowDot(x, y, 2.6, 0.9);
    if (k >= 1) { const sp = spots[p.spot]; if (sp && !sp.on) { sp.on = true; sfxLit(); } return false; }
    return true;
  });
  ctx.globalCompositeOperation = 'source-over';

  // sparks
  sparks = sparks.filter(p => (p.t += dt) < p.life);
  sparks.forEach(p => {
    p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // streak badge
  if (S.streak >= 2) {
    const t = `СЕРИЯ ×${Math.min(S.streak, 5)}`;
    ctx.font = `700 ${Math.round(c * 0.26)}px Unbounded, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(t).width + c * 0.5, ph = c * 0.46, px = bx + G.bw / 2 - tw / 2, py = by + G.bw + 6 - ph / 2 + (Math.sin(time * 6) * 1.5);
    ctx.fillStyle = THEME.ember; rr(px, py, tw, ph, ph / 2); ctx.fill();
    ctx.fillStyle = THEME.ink; ctx.fillText(t, bx + G.bw / 2, py + ph / 2 + 1); ctx.textBaseline = 'alphabetic';
  }

  // floating text
  floats = floats.filter(f => (f.t += dt) < (f.big ? 1.4 : 1.1));
  floats.forEach(f => {
    const life = f.big ? 1.4 : 1.1, k = f.t / life;
    const pop = f.big ? 1 + Math.max(0, 0.4 - f.t * 2) : 1;
    ctx.globalAlpha = 1 - k * k; ctx.textAlign = 'center';
    ctx.font = `${f.big ? 900 : 700} ${Math.round(c * (f.big ? 0.62 : f.small ? 0.34 : 0.44) * pop)}px Unbounded, system-ui, sans-serif`;
    const y = f.y - f.t * (f.big ? 20 : 40);
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, c * 0.12); ctx.strokeStyle = THEME.ink; ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = f.big ? THEME.accent : THEME.paper; ctx.fillText(f.text, f.x, y);
    ctx.globalAlpha = 1;
  });

  // level finished: wait for the last firefly, then light everything
  if (levelDone && !revealing && particles.length === 0) {
    revealing = true; sfxWin(); buzz([40, 60, 40, 60, 120]);
    for (let k = 0; k < 6; k++) burst(G.x + G.bw * (0.1 + k * 0.16), G.sceneY + G.sceneH * (0.3 + Math.random() * 0.4), 18, [THEME.accent, THEME.ember, THEME.paper, COLORS[k % COLORS.length][0]][k % 4]);
  }
  if (revealing && reveal < 1) { reveal = Math.min(1, reveal + dt / 1.6); if (reveal >= 1) setTimeout(showWin, 300); }

  requestAnimationFrame(frame);
}
function glowDot(x, y, r, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
  g.addColorStop(0, `rgba(255,255,220,${a})`); g.addColorStop(0.25, `rgba(220,255,120,${a * 0.7})`); g.addColorStop(1, 'rgba(200,255,100,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
}

/* ---------- Android back button ---------- */
try {
  const App = IS_APP && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) App.addListener('backButton', () => {
    if (!$('overlay').hidden) closeCard();
    else if (bombArmed) { bombArmed = false; updateHud(); }
    else showMenu();
  });
} catch (e) {}

/* ---------- boot ---------- */
if (S.tray.every(p => !p)) newTray();
layout(); updateHud();
window.addEventListener('resize', layout);
requestAnimationFrame(frame);
if (S.mode === 'daily' && (!S.dailyGame || S.dailyGame.date !== todayKey())) { S.mode = 'night'; Object.assign(S, S.nightStash || {}); if (S.tray.every(p => !p)) newTray(); buildScene(); updateHud(); }
if (!curInfo().endless && S.lit >= curInfo().need) levelDone = true;
else if (!S.seenHelp) showHelp();
else if (!S.tray.some(p => p && anyFits(p))) setTimeout(showStuck, 600);
})();
</script>
